
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
        }

        /* LOGIN BOX */
        .login-box {
            width: 380px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .login-box > p {
            text-align: center;
            color: #bbb;
            margin-bottom: 30px;
        }

        /* INPUTS */
        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 15px;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .input-box input::placeholder {
            color: #aaa;
        }

        .input-box input:focus {
            border-color: #00dbde;
            box-shadow: 0 0 12px rgba(0, 219, 222, 0.4);
        }

        /* PASSWORD */
        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        .show-password:hover {
            color: #00dbde;
        }

        /* FORGOT PASSWORD */
        .forgot {
            display: block;
            text-align: right;
            margin: -8px 0 20px;
            color: #00dbde;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 0 20px #00dbde,
                0 0 35px #fc00ff;
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* SIGN UP */
        .signup {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 14px;
        }

        .signup a {
            color: #00dbde;
            text-decoration: none;
            font-weight: bold;
        }

        /* POPUP OVERLAY */
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        /* POPUP */
        .popup {
            width: 350px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;
            background: #191735;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                0 0 30px rgba(0, 219, 222, 0.3),
                0 0 60px rgba(252, 0, 255, 0.2);

            animation: popupShow 0.35s ease;
        }

        @keyframes popupShow {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* SUCCESS ICON */
        .success-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;
            background: linear-gradient(135deg, #00dbde, #00a8aa);

            font-size: 35px;
            font-weight: bold;

            box-shadow: 0 0 25px rgba(0, 219, 222, 0.6);
        }

        .popup h2 {
            margin-bottom: 10px;
            font-size: 25px;
        }

        .popup p {
            color: #bbb;
            margin-bottom: 25px;
        }

        /* CONTINUE BUTTON */
        .popup-btn {
            border: none;
            padding: 12px 30px;
            border-radius: 50px;

            background: linear-gradient(90deg, #00dbde, #fc00ff);

            color: white;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        .popup-btn:hover {
            transform: scale(1.05);
            box-shadow:
                0 0 15px #00dbde,
                0 0 25px #fc00ff;
        }

        /* MOBILE */
        @media (max-width: 450px) {
            .login-box {
                width: 90%;
                padding: 30px 25px;
            }

            .popup {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="login-box">

        <h1>Welcome Back</h1>

        <p>Sign in to continue to your account</p>

        <form id="loginForm">

            <!-- EMAIL -->
            <div class="input-box">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <!-- PASSWORD -->
            <div class="input-box">

                <label for="password">
                    Password
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <!-- FORGOT PASSWORD -->
            <a href="#" class="forgot">
                Forgot Password?
            </a>

            <!-- LOGIN -->
            <button type="submit" class="login-btn">
                Login →
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="#">
                Create Account
            </a>
        </div>

    </div>


    <!-- SUCCESS POPUP -->
    <div class="popup-overlay" id="successPopup">

        <div class="popup">

            <div class="success-icon">
                ✓
            </div>

            <h2>Successfully Logged In!</h2>

            <p>
                Welcome back! You have successfully logged into your account.
            </p>

            <button
                class="popup-btn"
                onclick="goToNextPage()"
            >
                Continue →
            </button>

        </div>

    </div>


    <script>

        /* SHOW / HIDE PASSWORD */
        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "🙈";

            } else {

                password.type = "password";
                button.textContent = "👁️";

            }
        }


        /* LOGIN FORM */
        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                // Show successful login popup
                document
                    .getElementById("successPopup")
                    .style.display = "flex";

            });


        /* GO TO NEXT PAGE */
        function goToNextPage() {

            window.location.href = "nextpage.html";

        }

    </script>

</body>
</html>
